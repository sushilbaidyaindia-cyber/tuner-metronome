name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
          log-accepted-android-sdk-licenses: true

      - name: Build Debug APK
        run: |
          gradle wrapper --gradle-version 8.9
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Prepare APK for release
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/*.apk release/tuner-metronome.apk
          ls -la release/

      - uses: actions/upload-artifact@v4
        with:
          name: tuner-metronome-APK
          path: release/tuner-metronome.apk
          if-no-files-found: error

      # স্থায়ী সরাসরি ডাউনলোড লিংক তৈরি (GitHub Release)
      - name: Create or update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Tuner Metronome (Latest)
          body: |
            সঙ্গীত সহায়ক — টিউনার ও মেট্রোনোম
            (কাহারবা, দাদরা, তেওরা)

            **সরাসরি APK ডাউনলোড:** নিচের tuner-metronome.apk ফাইলে ক্লিক করুন।
          files: release/tuner-metronome.apk
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
